<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Palakodi Mugam Thandi — Audio Player</title>
<meta name="description" content="A simple, dependency-free audio player page.">
<style>
  :root{
    --bg:#140c1c; --bg2:#2a1233; --card:#ffffff12; --line:#ffffff22;
    --text:#fdf3ea; --muted:#cdb9c9; --accent:#ffb347; --accent2:#ff5e7e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--text);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    background:
      radial-gradient(900px 500px at 15% 0%, #ff5e7e33, transparent 60%),
      radial-gradient(800px 500px at 100% 100%, #ffb34733, transparent 60%),
      linear-gradient(160deg,var(--bg),var(--bg2));
    display:grid; place-items:center; padding:16px;
  }
  .player{
    width:100%; max-width:440px; padding:28px 24px 24px;
    background:var(--card); border:1px solid var(--line); border-radius:24px;
    backdrop-filter:blur(14px); box-shadow:0 30px 80px #0008;
  }
  .art{
    aspect-ratio:1; width:100%; border-radius:18px; overflow:hidden; position:relative;
    background:linear-gradient(135deg,var(--accent2),var(--accent));
    display:grid; place-items:center; margin-bottom:22px;
  }
  .art canvas{position:absolute; inset:0; width:100%; height:100%}
  .art .disc{
    width:46%; aspect-ratio:1; border-radius:50%; position:relative; z-index:1;
    background:radial-gradient(circle,#140c1c 0 9%,#2a1233 10% 14%,#140c1c 15% 100%);
    box-shadow:0 10px 30px #0006; animation:spin 6s linear infinite; animation-play-state:paused;
  }
  .disc::after{content:""; position:absolute; inset:0; border-radius:50%;
    background:conic-gradient(from 0deg,#fff0,#ffffff2e,#fff0 30%,#fff0 50%,#ffffff2e 80%,#fff0)}
  .playing .disc{animation-play-state:running}
  @keyframes spin{to{transform:rotate(360deg)}}
  h1{font-size:1.25rem; margin:0 0 4px; line-height:1.3}
  .sub{color:var(--muted); font-size:.9rem; margin:0 0 20px}
  .bar{display:flex; align-items:center; gap:10px; font-variant-numeric:tabular-nums; font-size:.82rem; color:var(--muted)}
  input[type=range]{
    -webkit-appearance:none; appearance:none; width:100%; height:6px; border-radius:99px; outline:none;
    background:linear-gradient(90deg,var(--accent) var(--p,0%),#ffffff2a var(--p,0%)); cursor:pointer;
  }
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; border:0}
  input[type=range]::-moz-range-thumb{width:16px; height:16px; border-radius:50%; background:#fff; border:0}
  input[type=range]:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--accent); outline-offset:3px}
  .controls{display:flex; justify-content:center; align-items:center; gap:14px; margin:20px 0 18px}
  button{
    border:1px solid var(--line); background:#ffffff14; color:var(--text);
    width:46px; height:46px; border-radius:50%; font-size:1.05rem; cursor:pointer; transition:.15s;
    display:grid; place-items:center;
  }
  button:hover{background:#ffffff26}
  button[aria-pressed=true]{background:var(--accent); color:#2a1233; border-color:transparent}
  #play{width:68px; height:68px; background:linear-gradient(135deg,var(--accent2),var(--accent)); border:0; color:#fff}
  #play svg{width:28px; height:28px; fill:currentColor}
  .row{display:flex; align-items:center; gap:12px; font-size:.82rem; color:var(--muted)}
  .row + .row{margin-top:12px}
  .row label{min-width:56px}
  select{background:#ffffff14; color:var(--text); border:1px solid var(--line); border-radius:8px; padding:4px 8px}
  select option{color:#000}
  footer{margin-top:18px; text-align:center; font-size:.75rem; color:var(--muted)}
  footer a{color:var(--accent)}
  .err{display:none; color:#ff9aa8; font-size:.85rem; margin-top:12px; text-align:center}
  @media (prefers-reduced-motion:reduce){.disc{animation:none}}
</style>
</head>
<body>
<main class="player" id="player">
  <div class="art">
    <canvas id="viz" aria-hidden="true"></canvas>
    <div class="disc" aria-hidden="true"></div>
  </div>

  <h1>Palakodi Mugam Thandi</h1>
  <p class="sub">Unna Mattum Paaka Aasa Vechen · 0:24 clip</p>

  <div class="bar">
    <span id="cur">0:00</span>
    <input id="seek" type="range" min="0" max="1000" value="0" step="1" aria-label="Seek">
    <span id="dur">0:00</span>
  </div>

  <div class="controls">
    <button id="back" title="Back 5s (←)" aria-label="Back 5 seconds">⏪</button>
    <button id="play" title="Play / Pause (Space)" aria-label="Play"><svg viewBox="0 0 24 24" id="ico"><path d="M8 5v14l11-7z"/></svg></button>
    <button id="fwd" title="Forward 5s (→)" aria-label="Forward 5 seconds">⏩</button>
    <button id="loop" title="Loop (L)" aria-label="Loop" aria-pressed="true">🔁</button>
  </div>

  <div class="row"><label for="vol">Volume</label><input id="vol" type="range" min="0" max="1" step="0.01" value="1"></div>
  <div class="row"><label for="rate">Speed</label>
    <select id="rate"><option>0.75</option><option selected>1</option><option>1.25</option><option>1.5</option></select>
  </div>
  <div class="err" id="err">Couldn't load the audio. Make sure <code>assets/song.mp3</code> is next to this page.</div>

  <audio id="a" src="assets/song.mp3" preload="metadata" loop></audio>
  <footer>Plain HTML · CSS · JS — no frameworks. <a href="assets/song.mp3" download>Download audio</a></footer>
</main>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const a = $('a'), seek = $('seek'), play = $('play'), ico = $('ico');
  const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';
  const PLAY = 'M8 5v14l11-7z', PAUSE = 'M6 5h4v14H6zM14 5h4v14h-4z';
  let dragging = false;

  const paint = () => {
    const p = a.duration ? a.currentTime / a.duration : 0;
    if (!dragging) seek.value = p * 1000;
    seek.style.setProperty('--p', (p*100) + '%');
    $('cur').textContent = fmt(a.currentTime);
  };
  const setPlaying = on => {
    $('player').classList.toggle('playing', on);
    ico.firstElementChild.setAttribute('d', on ? PAUSE : PLAY);
    play.setAttribute('aria-label', on ? 'Pause' : 'Play');
  };
  const toggle = () => a.paused ? a.play().catch(()=>{}) : a.pause();

  a.addEventListener('loadedmetadata', () => { $('dur').textContent = fmt(a.duration); paint(); });
  a.addEventListener('timeupdate', paint);
  a.addEventListener('play', () => { setPlaying(true); startViz(); });
  a.addEventListener('pause', () => setPlaying(false));
  a.addEventListener('ended', () => setPlaying(false));
  a.addEventListener('error', () => $('err').style.display = 'block');

  play.onclick = toggle;
  $('back').onclick = () => a.currentTime = Math.max(0, a.currentTime - 5);
  $('fwd').onclick  = () => a.currentTime = Math.min(a.duration || 0, a.currentTime + 5);
  $('loop').onclick = e => { a.loop = !a.loop; e.currentTarget.setAttribute('aria-pressed', a.loop); };
  $('vol').oninput  = e => a.volume = e.target.value;
  $('rate').onchange = e => a.playbackRate = +e.target.value;
  seek.addEventListener('input', () => { dragging = true; a.currentTime = (seek.value/1000) * (a.duration||0); paint(); });
  seek.addEventListener('change', () => dragging = false);

  document.addEventListener('keydown', e => {
    if (/INPUT|SELECT/.test(e.target.tagName) && e.key !== ' ' ) return;
    if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); toggle(); }
    else if (e.key === 'ArrowLeft') $('back').click();
    else if (e.key === 'ArrowRight') $('fwd').click();
    else if (e.key.toLowerCase() === 'l') $('loop').click();
  });

  // Visualizer: real FFT data over http(s); gentle fake bars on file:// (CORS blocks analysis)
  const cv = $('viz'), ctx = cv.getContext('2d');
  let analyser, data, started = false, real = false;
  function startViz(){
    if (started) return; started = true;
    if (location.protocol.startsWith('http')) {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        const ac = new AC(); const src = ac.createMediaElementSource(a);
        analyser = ac.createAnalyser(); analyser.fftSize = 128;
        src.connect(analyser); analyser.connect(ac.destination);
        data = new Uint8Array(analyser.frequencyBinCount); real = true;
        a.addEventListener('play', () => ac.state === 'suspended' && ac.resume());
      } catch(_) {}
    }
  }
  function draw(){
    const w = cv.width = cv.clientWidth * devicePixelRatio, h = cv.height = cv.clientHeight * devicePixelRatio;
    ctx.clearRect(0,0,w,h);
    const n = 32, bw = w / n, t = performance.now()/1000;
    if (real) analyser.getByteFrequencyData(data);
    for (let i=0;i<n;i++){
      let v = real ? data[i]/255 : (a.paused ? 0.05 : 0.25 + 0.2*Math.sin(t*3 + i*.7) + 0.15*Math.sin(t*5.3 + i*1.9));
      const bh = Math.max(4, v * h * 0.45);
      ctx.fillStyle = '#ffffff55';
      ctx.fillRect(i*bw + bw*0.15, h - bh, bw*0.7, bh);
    }
    requestAnimationFrame(draw);
  }
  draw();
})();
</script>
</body>
</html>
