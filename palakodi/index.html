<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For Kirthi · Palakodi Mugam Thandi</title>
<meta name="theme-color" content="#2b1030">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Nunito+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* Dusk garden: plum sky, rose and jasmine light, one big italic name. */
  :root{
    --ink:#220b27; --plum:#4a1943; --rose:#ee7d97; --blush:#ffc2cf; --gold:#f7c978; --cream:#fff1e8;
    --muted:#e3c3d2; --glass:#ffffff14; --line:#ffffff2e;
    --serif:"Cormorant Garamond", "Playfair Display", Georgia, serif;
    --sans:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; color:var(--cream); font-family:var(--sans); background-color:var(--ink);
    background:
      radial-gradient(70vmax 50vmax at 50% -10%, #8a2f5f88, transparent 60%),
      radial-gradient(60vmax 40vmax at 100% 100%, #f7c97833, transparent 60%),
      radial-gradient(50vmax 40vmax at 0% 100%, #ee7d9733, transparent 60%),
      linear-gradient(180deg,#2b1030,#1a0a20);
    overflow-x:hidden;
  }
  #petals{position:fixed; inset:0; width:100%; height:100%; pointer-events:none}
  .stage{
    position:relative; min-height:100%; display:grid; place-items:center; text-align:center;
    padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));
  }
  .content{display:flex; flex-direction:column; align-items:center; gap:14px; width:100%; max-width:460px}
  .eyebrow{margin:0; font-size:.78rem; letter-spacing:.32em; text-transform:uppercase; color:var(--blush)}
  .name{
    margin:0; font-family:var(--serif); font-style:italic; font-weight:600;
    font-size:clamp(4.2rem,22vw,8.5rem); line-height:.95;
    background:linear-gradient(180deg,var(--cream) 10%,var(--blush) 55%,var(--rose));
    -webkit-background-clip:text; background-clip:text; color:transparent;
    filter:drop-shadow(0 6px 30px #ee7d9755);
  }
  /* player ring */
  .ring{position:relative; width:min(66vw,240px); aspect-ratio:1; margin:10px 0 6px; max-width:100%}
  .ring > svg{position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg)}
  .ring .track{fill:none; stroke:#ffffff22; stroke-width:3}
  .ring .prog{fill:none; stroke:url(#g); stroke-width:4; stroke-linecap:round; stroke-dasharray:628.32; stroke-dashoffset:628.32}
  .glow{position:absolute; inset:12%; border-radius:50%; background:radial-gradient(circle,#ee7d9766,transparent 70%); opacity:.5}
  .playing .glow{animation:beat 1.6s ease-in-out infinite}
  @keyframes beat{0%,100%{transform:scale(1); opacity:.45}50%{transform:scale(1.18); opacity:.9}}
  #play{
    position:absolute; inset:17%; border-radius:50%; border:1px solid #ffffff40; cursor:pointer; color:#fff;
    background:linear-gradient(145deg,var(--rose),#c9487a 60%,#8e2f68); display:grid; place-items:center;
    box-shadow:0 14px 40px #c9487a66, inset 0 1px 0 #ffffff55; transition:transform .2s;
  }
  #play:hover{transform:scale(1.04)}
  #play svg{position:absolute; inset:0; margin:auto; width:38%; height:38%; fill:currentColor}
  .line{margin:6px 0 0; min-height:3.2em; font-family:var(--serif); font-style:italic; font-size:clamp(1.25rem,5.4vw,1.6rem); line-height:1.35; color:var(--cream); transition:opacity .6s; text-wrap:balance}
  .line.out{opacity:0}
  .song{margin:0; font-size:.8rem; letter-spacing:.18em; text-transform:uppercase; color:var(--muted)}
  .mini{display:flex; align-items:center; gap:12px; width:100%; margin-top:6px; font-size:.8rem; color:var(--muted); font-variant-numeric:tabular-nums}
  input[type=range]{-webkit-appearance:none; appearance:none; flex:1; min-width:0; height:4px; border-radius:99px; background:linear-gradient(90deg,var(--gold) var(--p,0%),#ffffff2a var(--p,0%)); outline:none; cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--cream); border:0}
  input[type=range]::-moz-range-thumb{width:14px; height:14px; border-radius:50%; background:var(--cream); border:0}
  .tools{display:flex; gap:10px; align-items:center; justify-content:center; margin-top:2px}
  .chip{border:1px solid var(--line); background:var(--glass); color:var(--cream); font:inherit; font-size:.8rem; padding:8px 14px; border-radius:99px; cursor:pointer}
  .chip[aria-pressed=true]{background:var(--gold); color:#3a1236; border-color:transparent}
  .sign{margin:10px 0 0; font-family:var(--serif); font-style:italic; font-size:1.3rem; color:var(--blush)}
  button:focus-visible,input:focus-visible{outline:2px solid var(--gold); outline-offset:3px}

  /* tap-to-open gift screen, shown only if the browser blocks autoplay */
  .splash{position:fixed; inset:0; z-index:5; display:grid; place-items:center; padding:24px; background:#1a0a20ee; backdrop-filter:blur(8px); transition:opacity .8s, visibility .8s}
  .splash[hidden]{display:none}
  .splash.gone{opacity:0; visibility:hidden}
  .gift{background:none; border:0; color:var(--cream); cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:16px; font-family:var(--serif); font-style:italic}
  .gift .heart{width:96px; height:96px; display:grid; place-items:center; border-radius:50%; background:linear-gradient(145deg,var(--rose),#8e2f68); box-shadow:0 0 0 0 #ee7d9788; animation:pulse 2s infinite}
  .gift .heart svg{width:44px; height:44px; fill:#fff}
  .gift b{font-size:2rem; font-weight:600}
  .gift span{font-family:var(--sans); font-style:normal; font-size:.85rem; letter-spacing:.2em; text-transform:uppercase; color:var(--muted)}
  @keyframes pulse{0%{box-shadow:0 0 0 0 #ee7d9799}100%{box-shadow:0 0 0 34px #ee7d9700}}
  @media (prefers-reduced-motion:reduce){.playing .glow,.gift .heart{animation:none}}
</style>
</head>
<body>
<canvas id="petals" aria-hidden="true"></canvas>

<div class="splash" id="splash" hidden>
  <button class="gift" id="open" aria-label="Open your surprise and play the song">
    <div class="heart"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.3 3 5 6.3 5c2 0 3.7 1.1 4.7 2.7h2C14 6.1 15.7 5 17.7 5 21 5 23.1 8.3 21.6 11.800 19.500 16.400 12 21 12 21z"/></svg></div>
    <b>Something for you</b>
    <span>Tap to open</span>
  </button>
</div>

<main class="stage" id="stage">
  <div class="content">
    <p class="eyebrow">This one is for</p>
    <h1 class="name" id="to">Kirthi</h1>

    <div class="ring">
      <div class="glow"></div>
      <svg viewBox="0 0 220 220" aria-hidden="true">
        <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f7c978"/><stop offset="1" stop-color="#ee7d97"/></linearGradient></defs>
        <circle class="track" cx="110" cy="110" r="100"/>
        <circle class="prog" id="prog" cx="110" cy="110" r="100"/>
      </svg>
      <button id="play" aria-label="Play"><svg viewBox="0 0 24 24"><path id="ico" d="M8 5v14l11-7z"/></svg></button>
    </div>

    <p class="line" id="line"></p>
    <p class="song">Palakodi Mugam Thandi</p>

    <div class="mini">
      <span id="cur">0:00</span>
      <input id="seek" type="range" min="0" max="1000" value="0" aria-label="Seek">
      <span id="dur">0:24</span>
    </div>
    <div class="tools">
      <button class="chip" id="loop" aria-pressed="true">Repeat</button>
      <label class="chip" style="display:flex;gap:8px;align-items:center">Volume
        <input id="vol" type="range" min="0" max="1" step="0.01" value="1" style="width:84px;--p:100%" aria-label="Volume"></label>
    </div>
    <p class="sign">with all my love, Sam</p>
  </div>
</main>

<audio id="a" src="assets/song.mp3" preload="auto" loop></audio>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const a = $('a'), seek = $('seek'), ico = $('ico');
  // Edit these lines to change the little notes that appear while the song plays.
  const LINES = [
    "You are the first thing I want to see every morning.",
    "Every song I love sounds a little more like you.",
    "Wherever I am, my heart knows the way to you.",
    "Stay with me, Kirthi. Always."
  ];
  const fmt = s => isFinite(s) ? Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0') : '0:00';
  const PLAY='M8 5v14l11-7z', PAUSE='M6 5h4v14H6zM14 5h4v14h-4z', C=628.32;
  let lineIdx=-1, dragging=false;

  function showLine(i){
    if(i===lineIdx) return; lineIdx=i;
    const el=$('line'); el.classList.add('out');
    setTimeout(()=>{el.textContent=LINES[i]; el.classList.remove('out')}, lineIdx===0&&!el.textContent?0:500);
  }
  function paint(){
    const d=a.duration||0, p=d?a.currentTime/d:0;
    $('prog').style.strokeDashoffset = C*(1-p);
    if(!dragging) seek.value = p*1000;
    seek.style.setProperty('--p',(p*100)+'%');
    $('cur').textContent=fmt(a.currentTime);
    showLine(Math.min(LINES.length-1, Math.floor(p*LINES.length)));
  }
  const setPlaying = on => {
    $('stage').classList.toggle('playing',on);
    ico.setAttribute('d',on?PAUSE:PLAY);
    $('play').setAttribute('aria-label',on?'Pause':'Play');
  };
  const toggle = () => a.paused ? a.play().catch(()=>{}) : a.pause();

  a.addEventListener('loadedmetadata',()=>{$('dur').textContent=fmt(a.duration);paint()});
  a.addEventListener('timeupdate',paint);
  a.addEventListener('play',()=>setPlaying(true));
  a.addEventListener('pause',()=>setPlaying(false));
  $('play').onclick=toggle;
  $('loop').onclick=e=>{a.loop=!a.loop; e.currentTarget.setAttribute('aria-pressed',a.loop)};
  $('vol').oninput=e=>{a.volume=e.target.value; e.target.style.setProperty('--p',(e.target.value*100)+'%')};
  seek.addEventListener('input',()=>{dragging=true;a.currentTime=(seek.value/1000)*(a.duration||0);paint()});
  seek.addEventListener('change',()=>dragging=false);
  document.addEventListener('keydown',e=>{ if(e.code==='Space' && !/BUTTON|INPUT/.test(e.target.tagName)){e.preventDefault();toggle()} });
  showLine(0);

  // Try to play as soon as the page opens. If the browser blocks sound, show a gift screen; one tap starts it.
  const splash=$('splash');
  a.play().catch(()=>{ splash.hidden=false; });
  $('open').onclick=()=>{ a.play().catch(()=>{}); splash.classList.add('gone'); setTimeout(()=>splash.hidden=true,900); };

  // Falling petals
  const cv=$('petals'), ctx=cv.getContext('2d'), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cols=['#ffc2cf','#ee7d97','#fff1e8','#f7c978','#ffd9e2'];
  let W,H,dpr,P=[];
  function size(){dpr=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*dpr;H=cv.height=innerHeight*dpr}
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function make(top){return{x:rnd(0,W),y:top?rnd(-H*.2,-10):rnd(0,H),s:rnd(7,15)*dpr,v:rnd(.35,1)*dpr,sw:rnd(.5,1.6),ph:rnd(0,6.28),r:rnd(0,6.28),rv:rnd(-.02,.02),c:cols[(Math.random()*cols.length)|0],al:rnd(.35,.85)}}
  function petal(p){
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=p.al;ctx.fillStyle=p.c;
    ctx.beginPath();ctx.moveTo(0,-p.s);ctx.bezierCurveTo(p.s*.9,-p.s*.5,p.s*.7,p.s*.6,0,p.s);ctx.bezierCurveTo(-p.s*.7,p.s*.6,-p.s*.9,-p.s*.5,0,-p.s);ctx.fill();ctx.restore();
  }
  function frame(t){
    ctx.clearRect(0,0,W,H);
    for(const p of P){
      if(!reduce){p.y+=p.v;p.x+=Math.sin(t/1000*p.sw+p.ph)*.6*dpr;p.r+=p.rv; if(p.y>H+20){Object.assign(p,make(true))}}
      petal(p);
    }
    if(!reduce) requestAnimationFrame(frame);
  }
  size(); addEventListener('resize',size);
  const n=Math.round(Math.min(34,Math.max(16,innerWidth/38)));
  P=Array.from({length:n},()=>make(false));
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
